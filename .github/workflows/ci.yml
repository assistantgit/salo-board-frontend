name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: runner / biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
      - uses: reviewdog/action-setup@v1
      - name: Run Biome with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          biome check --format=rdjson . | reviewdog -f=rdjson -reporter=github-pr-review -level=warning

  type-check:
    name: runner / tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - uses: reviewdog/action-setup@v1
      - name: Run tsc with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsc --noEmit | reviewdog -f=tsc -reporter=github-pr-review -level=error

