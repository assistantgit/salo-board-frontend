openapi: 3.0.3
info:
  title: My API
  version: 1.0.0
  description: Документація API
paths:
  /api/admin/chats:
    get:
      operationId: admin_chats_list
      description: Отримання списку всіх чатів усіх юзерів. За замовчуванням повертаються
        відкриті чати, якщо не вказано is_solved=true
      summary: Список чатів (Адмін)
      parameters:
      - in: query
        name: is_solved
        schema:
          type: boolean
        description: 'Фільтрація по статусу (за замовчуванням: false)'
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
          description: ''
  /api/admin/chats/{chat_id}:
    patch:
      operationId: admin_chats_partial_update
      description: Зміна статусу is_solved для будь-якого чату.
      summary: Закрити/відкрити чат (Адмін)
      parameters:
      - in: path
        name: chat_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChat'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChat'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
          description: ''
  /api/admin/chats/{chat_id}/messages:
    get:
      operationId: admin_chats_messages_list
      description: Отримання 50 останніх повідомлень будь-якого чату.
      summary: Історія повідомлень (Адмін)
      parameters:
      - in: path
        name: chat_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
          description: ''
  /api/admin/tournaments:
    get:
      operationId: admin_tournaments_list
      description: Отримання списку всіх турнірів. Доступно для адміністраторів.
      summary: Список турнірів (Адмін)
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tournament'
          description: ''
    post:
      operationId: admin_tournaments_create
      description: Створення нового турніру. Автор турніру автоматично стає його творцем.
      summary: Створити турнір (Адмін)
      tags:
      - admin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tournament'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tournament'
          application/json:
            schema:
              $ref: '#/components/schemas/Tournament'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
          description: ''
  /api/admin/tournaments/{tournament_id}:
    get:
      operationId: admin_tournaments_retrieve
      description: Отримання детальної інформації про турнір.
      summary: Деталі турніру (Адмін)
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
          description: ''
    patch:
      operationId: admin_tournaments_partial_update
      description: Редагування турніру. Успішно тільки якщо статус DRAFT.
      summary: Редагувати турнір (Адмін)
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTournamentDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTournamentDetail'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTournamentDetail'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
          description: ''
    delete:
      operationId: admin_tournaments_destroy
      description: Видалення турніру. Тільки для статусів DRAFT.
      summary: Видалити турнір (Адмін)
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/tournaments/{tournament_id}/admin:
    get:
      operationId: admin_tournaments_admin_list
      description: Отримання списку адміністраторів конкретного турніру.
      summary: Список адміністраторів турніру
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TournamentAdmin'
          description: ''
    post:
      operationId: admin_tournaments_admin_create
      description: Додавання адміністратора за invite_code.
      summary: Запросити адміністратора турніру
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                invite_code:
                  type: string
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentAdmin'
          description: ''
  /api/admin/tournaments/{tournament_id}/jury:
    get:
      operationId: admin_tournaments_jury_list
      description: Отримання списку членів журі.
      summary: Список журі турніру (Адмін)
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TournamentJury'
          description: ''
    post:
      operationId: admin_tournaments_jury_create
      description: Додавання журі за invite_code.
      summary: Запросити журі (Адмін)
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                invite_code:
                  type: string
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentJury'
          description: ''
  /api/admin/tournaments/{tournament_id}/rounds:
    get:
      operationId: admin_tournaments_rounds_list
      description: Отримання списку раундів турніру.
      summary: Список раундів (Адмін)
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Round'
          description: ''
    post:
      operationId: admin_tournaments_rounds_create
      description: Створення нового раунду турніру.
      summary: Створити раунд (Адмін)
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Round'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Round'
          application/json:
            schema:
              $ref: '#/components/schemas/Round'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Round'
          description: ''
  /api/admin/tournaments/{tournament_id}/rounds/{round_id}:
    get:
      operationId: admin_tournaments_rounds_retrieve
      description: Отримання деталей конкретного раунду.
      summary: Деталі раунду (Адмін)
      parameters:
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Round'
          description: ''
    patch:
      operationId: admin_tournaments_rounds_partial_update
      description: Редагування можливе тільки для раундів у статусі Draft.
      summary: Редагувати раунд (Адмін)
      parameters:
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRound'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRound'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRound'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Round'
          description: ''
    delete:
      operationId: admin_tournaments_rounds_destroy
      description: Видалення можливе тільки для раундів у статусі Draft.
      summary: Видалити раунд (Адмін)
      parameters:
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/tournaments/{tournament_id}/rounds/{round_id}/attachment:
    post:
      operationId: admin_tournaments_rounds_attachment_create
      description: Створення нового матеріалу (attachment).
      summary: Додати матеріали до раунду (Адмін)
      parameters:
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoundAttachment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoundAttachment'
          application/json:
            schema:
              $ref: '#/components/schemas/RoundAttachment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundAttachment'
          description: ''
  /api/admin/tournaments/{tournament_id}/rounds/{round_id}/criterion:
    post:
      operationId: admin_tournaments_rounds_criterion_create
      description: Створення нового критерію оцінювання в раунді.
      summary: Додати критерій (Адмін)
      parameters:
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EvaluationCriterion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvaluationCriterion'
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationCriterion'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationCriterion'
          description: ''
  /api/admin/tournaments/{tournament_id}/rounds/{round_id}/evaluation:
    get:
      operationId: admin_tournaments_rounds_evaluation_list
      description: Отримання списку оцінок журі для раунду.
      summary: Список оцінок (Адмін)
      parameters:
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evaluation'
          description: ''
  /api/admin/tournaments/{tournament_id}/rounds/{round_id}/evaluation/{evaluation_id}:
    get:
      operationId: admin_tournaments_rounds_evaluation_retrieve
      description: Отримання детальної інформації про конкретну оцінку від члена журі.
      summary: Деталі оцінки (Адмін)
      parameters:
      - in: path
        name: evaluation_id
        schema:
          type: integer
        required: true
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
          description: ''
  /api/admin/tournaments/{tournament_id}/rounds/{round_id}/requirement:
    post:
      operationId: admin_tournaments_rounds_requirement_create
      description: Створення нової вимоги для сабміту в раунді.
      summary: Додати вимогу (Адмін)
      parameters:
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoundRequirement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoundRequirement'
          application/json:
            schema:
              $ref: '#/components/schemas/RoundRequirement'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundRequirement'
          description: ''
  /api/admin/tournaments/{tournament_id}/rounds/{round_id}/start:
    patch:
      operationId: admin_tournaments_rounds_start_partial_update
      description: Зміна статусу раунду з DRAFT на ACTIVE. Перевіряється наявність
        критеріїв і вимог.
      summary: Запустити раунд (Адмін)
      parameters:
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Round'
          description: ''
  /api/admin/tournaments/{tournament_id}/rounds/{round_id}/submit:
    get:
      operationId: admin_tournaments_rounds_submit_list
      description: Отримання списку робіт (сабмітів) команд для конкретного раунду.
      summary: Список сабмітів раунду (Адмін)
      parameters:
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
          description: ''
  /api/admin/tournaments/{tournament_id}/rounds/{round_id}/submit/{submission_id}:
    get:
      operationId: admin_tournaments_rounds_submit_retrieve
      description: Отримання детальної інформації про конкретний сабміт.
      summary: Деталі сабміту (Адмін)
      parameters:
      - in: path
        name: round_id
        schema:
          type: integer
        required: true
      - in: path
        name: submission_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
  /api/admin/tournaments/{tournament_id}/start:
    patch:
      operationId: admin_tournaments_start_partial_update
      description: Переведення турніру зі статусу DRAFT в стан REGISTRATION.
      summary: Запустити турнір (Адмін)
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
          description: ''
  /api/admin/tournaments/{tournament_id}/teams:
    get:
      operationId: admin_tournaments_teams_list
      description: Отримання списку всіх команд турніру. Доступно для адміністраторів.
      summary: Команди турніру (Адмін)
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
          description: ''
  /api/admin/tournaments/{tournament_id}/teams/{team_id}/disqualify:
    patch:
      operationId: admin_tournaments_teams_disqualify_partial_update
      description: Зміна статусу команди на DISQUALIFIED. Доступно для адміністраторів.
      summary: Дискваліфікувати команду (Адмін)
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/admin/tournaments/{tournament_id}/teams/{team_id}/participants:
    get:
      operationId: admin_tournaments_teams_participants_list
      description: Отримання списку учасників команди.
      summary: Список учасників команди (Адмін)
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
          description: ''
  /api/admin/tournaments/{tournament_id}/teams/{team_id}/participants/{user_id}:
    patch:
      operationId: admin_tournaments_teams_participants_partial_update
      description: Встановлює вказаного учасника командиром команди.
      summary: Передати статус командира (Адмін)
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
          description: ''
    delete:
      operationId: admin_tournaments_teams_participants_destroy
      description: Видалення учасника з команди.
      summary: Видалити учасника (Адмін)
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/chats:
    get:
      operationId: chats_list
      description: Отримання списку тільки своїх чатів. Підтримує фільтрацію ?is_solved=true/false
      summary: Список чатів (Користувач)
      parameters:
      - in: query
        name: is_solved
        schema:
          type: boolean
        description: Фільтрація по статусу
      tags:
      - chats
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
          description: ''
    post:
      operationId: chats_create
