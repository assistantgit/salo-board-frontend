components:
  schemas:
    ActionTypeEnum:
      enum:
      - YN
      - NN
      - MG
      type: string
      description: |-
        * `YN` - Yes/No
        * `NN` - None
        * `MG` - Message
    Chat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        isSolved:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - id
      - user
    CriterionEvaluation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        score:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        comment:
          type: string
        evaluation:
          type: integer
          readOnly: true
        criterion:
          type: integer
          readOnly: true
      required:
      - comment
      - criterion
      - evaluation
      - id
      - score
    CustomTokenObtainPair:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
      required:
      - email
      - password
    Evaluation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        jury:
          type: integer
          readOnly: true
        juryUsername:
          type: string
          readOnly: true
        submission:
          type: integer
          readOnly: true
        comment:
          type: string
        status:
          $ref: '#/components/schemas/EvaluationStatusEnum'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        submittedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - comment
      - createdAt
      - id
      - jury
      - juryUsername
      - submission
      - submittedAt
      - updatedAt
    EvaluationCriterion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 100
        maxScore:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        weight:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        orderIndex:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        round:
          type: integer
          readOnly: true
      required:
      - category
      - id
      - maxScore
      - orderIndex
      - round
      - title
      - weight
    EvaluationStatusEnum:
      enum:
      - DR
      - SB
      type: string
      description: |-
        * `DR` - Draft
        * `SB` - Submitted
    LeaderboardItem:
      type: object
      properties:
        teamId:
          type: integer
        teamName:
          type: string
        score:
          type: integer
      required:
      - score
