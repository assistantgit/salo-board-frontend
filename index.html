<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="public/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>salo-board-frontend</title>
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('app-theme'); } catch (_) { }
      var theme =
        stored === 'light' || stored === 'dark'
          ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.add('theme-init');
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app/endpoint/index.tsx"></script>
</body>

</html>
