<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- icon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@300;400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
    rel="stylesheet" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaloBoard</title>
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('app-theme'); } catch (_) { }
      var theme =
        stored === 'light' || stored === 'dark'
          ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.add('theme-init');
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app/endpoint/index.tsx"></script>
</body>

</html>
